[project]
name = "cache-mcp"
version = "0.1.0"
description = "MCP server for caching command and tool invocation results"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
cache-mcp = "cache_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["BLE001"]
